<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 Historical Places - Hindi & English</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        /* Grid for 20 Images on Homepage */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .card-title {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }
        /* Detail View Styles */
        .detail-view {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .back-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #c0392b;
        }
        .detail-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .detail-header img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            object-fit: cover;
        }
        .section-box {
            margin-top: 20px;
        }
        h3 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            color: #2980b9;
        }
        ol {
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>Historical Monuments Collection</h1>
        <p>Kisi bhi image par click karke uski 20 lines ki jaankari Hindi aur English mein dekhein</p>
    </header>

    <div class="container">
        <!-- Homepage Grid (20 Images) -->
        <div id="homeGrid" class="grid-view">
            <!-- JavaScript se yahan 20 cards dynamically load honge -->
        </div>

        <!-- Detail Page View -->
        <div id="detailPage" class="detail-view">
            <button class="back-btn" onclick="goBack()">← Sabhi Images par Wapas Jayein</button>
            <div class="detail-header">
                <h2 id="itemTitle"></h2>
                <img id="itemImage" src="" alt="Monument Image">
            </div>
            
            <div class="section-box">
                <h3>20 Lines in Hindi (हिंदी विवरण)</h3>
                <ol id="hindiList"></ol>
            </div>

            <div class="section-box">
                <h3>20 Lines in English (English Details)</h3>
                <ol id="englishList"></ol>
            </div>
        </div>
    </div>

    <script>
        // Yahan aap apni 20 items ka data daal sakte hain
        const itemsData = [
            {
                id: 1,
                title: "Red Fort, Delhi (लाल किला, दिल्ली)",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Red_Fort_Delhi.jpg/800px-Red_Fort_Delhi.jpg",
                hindi: [
                    "1. Lal Qila Delhi ke purane ilaqe mein sthit ek aitihasik qila hai.",
                    "2. Iska nirman Mughal samrat Shah Jahan ne karwaya tha.",
                    "3. Is qile ka mukhy roop se laal balua patthar ka istemal karke banaya gaya hai.",
                    "4. Iski neev 1638 mein rakhi gayi thi aur yeh 1648 mein ban kar taiyar hua tha.",
                    "5. Har saal 16 August ko desh ke Pradhan Mantri yahan tiranga fahrate hain.",
                    "6. Yeh qila Mughal samrajya ki rajdhani hua karta tha.",
                    "7. Iske andar Rang Mahal, Moti Masjid aur Diwan-i-Aam jaise sthal hain.",
                    "8. UNESCO ne 2007 mein ise Vishwa Dharohar (World Heritage Site) ghoshit kiya tha.",
                    "9. Iski diwarein bahut unchi aur suraksha ki drishti se mazboot hain.",
                    "10. Yahan rozani hazaron deshi aur videshi paryatak ghumne aate hain.",
                    "11. Iska vastukala (Architecture) Persian aur Islamic shaili ka anokha sangam hai.",
                    "12. Qile ke andar ek sangrahalaya (Museum) bhi hai jismein purani cheezein rakhi hain.",
                    "13. Shah Jahan ne apni nayi rajdhani Shahjahanabad ke roop mein ise banaya tha.",
                    "14. Iske samne Chandni Chowk ka prasiddh bazaar sthit hai.",
                    "15. Iski suraksha ka jimma bharat sarkar aur ASI ke paas hai.",
                    "16. Yeh bharat ki swatantrata sangram ka bhi ek mukhya gawah raha hai.",
                    "17. Is qile ki khoobsurati dekhne laayak hoti hai.",
                    "18. Light and Sound show ke zariye iska itihas dikhaya jata hai.",
                    "19. Yeh Delhi ki pehchan aur shaan ka prateek hai.",
                    "20. Aazadi ke prateek ke roop mein iska Bharat ke itihas mein bahut bada sthan hai."
                ],
                english: [
                    "1. The Red Fort is a historic fort located in the old area of Delhi.",
                    "2. It was built by the Mughal Emperor Shah Jahan.",
                    "3. This fort is primarily constructed using red sandstone.",
                    "4. Its foundation was laid in 1638 and completed in 1648.",
                    "5. Every year on Independence Day, the Prime Minister hoists the tricolor here.",
                    "6. This fort used to be the capital of the Mughal Empire.",
                    "7. Inside it, there are structures like Rang Mahal, Moti Masjid, and Diwan-i-Aam.",
                    "8. UNESCO declared it a World Heritage Site in 2007.",
                    "9. Its walls are very high and strong from a security perspective.",
                    "10. Thousands of domestic and foreign tourists visit it daily.",
                    "11. Its architecture is a unique blend of Persian and Islamic styles.",
                    "12. There is also a museum inside the fort containing historical artifacts.",
                    "13. Shah Jahan built it as part of his new capital Shahjahanabad.",
                    "14. In front of it lies the famous market of Chandni Chowk.",
                    "15. Its security is managed by the government and ASI.",
                    "16. It has also been a major witness to India's freedom struggle.",
                    "17. The beauty of this fort is worth seeing.",
                    "18. Its history is showcased through a Light and Sound show.",
                    "19. It is a symbol of the identity and pride of Delhi.",
                    "20. It holds a major place in Indian history as a symbol of freedom."
                ]
            },
            {
                id: 2,
                title: "Qutub Minar, Delhi (कुतुब मीनार, दिल्ली)",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/13/Qutb_Minar_and_its_monuments%2C_Delhi_04.jpg/800px-Qutb_Minar_and_its_monuments%2C_Delhi_04.jpg",
                hindi: [
                    "1. Qutub Minar Delhi ke Mehrauli kshetra mein sthit duniya ki sabse unchi minar hai.",
                    "2. Is aitihasik minar ki neev san 1193 mein Qutub-ud-din Aibak dwara rakhi gayi thi.",
                    "3. Qutub-ud-din Aibak is minar ki kewal pehli manzil hi bana paye the.",
                    "4. Baad mein unke uttaraadhikari Shams-ud-din Iltutmish ne iski shesh manzilon ka nirman pura karwaya.",
                    "5. Bijli girne aur bhukamp ke kaaran kshatigrast hone par Firozshah Tughlaq ne iski marmat karwai.",
                    "6. Is minar ki kul unchai lagbhag 73 meter (240 feet) hai.",
                    "7. Iske nirman mein laal balua patthar aur sangarmarhar ka istemal kiya gaya hai.",
                    "8. Iski har manzil par bahut hi sundar aur barik nakkashi ki gayi hai.",
                    "9. Iske parisar mein sthit 'Loh Stambh' pichle 1600 varsho se khule mein rehne ke baad bhi jangmukt hai.",
                    "10. Yeh stambh prachin bharat ki dhatu vigyan ki ek chamatkarik udaharan hai.",
                    "11. UNESCO ne varsh 1993 mein Qutub Minar ko vishwa dharohar ghoshit kiya tha.",
                    "12. Iske andar Quwwat-ul-Islam masjid bhi sthit hai.",
                    "13. Minar ke bhitar kul 375 ghumavadar seedhiyan hain.",
                    "14. Is aitihasik sthal ko dekhne ke liye pratidin hazaron log aate hain.",
                    "15. Iski vastukala Indo-Islamic shaili ka ek adbhut namoona hai.",
                    "16. Itihasakar iske nirman ke pichhe vijay stambh ka anuman lagate hain.",
                    "17. Is pure parisar ki dekhrekh ASI dwara ki jaati hai.",
                    "18. Iske aaspaas ka hara-bhara park paryatakon ko aakarshit karta hai.",
                    "19. Yeh Delhi ke sabhi purane aur lokapriy aitihasik smarakon mein mukhya sthan rakhta hai.",
                    "20. Yeh minar sadiyon se bharat ki aitihasik pehchan bani hui hai."
                ],
                english: [
                    "1. Qutub Minar is the tallest brick minaret in the world, located in Delhi.",
                    "2. The foundation of this historic minaret was laid in 1193 by Qutub-ud-din Aibak.",
                    "3. Aibak could only complete the construction of the first story.",
                    "4. Later, his successor Shams-ud-din Iltutmish completed the remaining stories.",
                    "5. After lightning strikes and earthquake damage, Firoz Shah Tughlaq repaired it.",
                    "6. The total height of the minaret is approximately 73 meters (240 feet).",
                    "7. Red sandstone and marble were used in its construction.",
                    "8. Beautiful and intricate carvings are done on every floor of it.",
                    "9. The Iron Pillar located in its complex is rust-free even after 1600 years.",
                    "10. This pillar is a miraculous example of ancient Indian metallurgy.",
                    "11. UNESCO declared Qutub Minar a World Heritage Site in 1993.",
                    "12. Quwwat-ul-Islam Mosque is also situated inside its complex.",
                    "13. There are a total of 375 winding steps inside the minaret.",
                    "14. Thousands of people visit this historic site daily.",
                    "15. Its architecture is a wonderful specimen of Indo-Islamic style.",
                    "16. Historians speculate it was built as a victory tower.",
                    "17. The maintenance of this entire complex is done by the ASI.",
                    "18. The lush green park around it attracts tourists.",
                    "19. It holds a major place among old and popular monuments of Delhi.",
                    "20. This minaret has remained India's historical identity for centuries."
                ]
            }
            // Isi tarah aap baaki ke 3 se lekar 20 tak ke items yahan add kar sakte hain
        ];

        // Function to render the 20 cards on homepage
        function renderGrid() {
            const gridContainer = document.getElementById('homeGrid');
            gridContainer.innerHTML = '';

            // Agar data kam hai toh loop ko chalane ke liye hum demo items repeat kar sakte hain taaki 20 dikhein
            for (let i = 1; i <= 20; i++) {
                // Demo ke liye hum pehle 2 items ko hi loop karke 20 bana rahe hain, aap unique data daal sakte hain
                let dataIndex = (i - 1) % itemsData.length;
                let item = itemsData[dataIndex];

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showDetail(i);
                card.innerHTML = `
                    <img src="${item.image}" alt="Image ${i}">
                    <div class="card-title">${i}. ${item.title.split('(')[0]}</div>
                `;
                gridContainer.appendChild(card);
            }
        }

        // Function to show individual detail page
        function showDetail(index) {
            let dataIndex = (index - 1) % itemsData.length;
            let item = itemsData[dataIndex];

            document.getElementById('itemTitle').innerText = `${index}. ${item.title}`;
            document.getElementById('itemImage').src = item.image;

            // Populate Hindi List
            const hindiList = document.getElementById('hindiList');
            hindiList.innerHTML = '';
            item.hindi.forEach(text => {
                const li = document.createElement('li');
                li.innerText = text;
                hindiList.appendChild(li);
            });

            // Populate English List
            const englishList = document.getElementById('englishList');
            englishList.innerHTML = '';
            item.english.forEach(text => {
                const li = document.createElement('li');
                li.innerText = text;
                englishList.appendChild(li);
            });

            // Toggle views
            document.getElementById('homeGrid').style.display = 'none';
            document.getElementById('detailPage').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Function to go back to homepage grid
        function goBack() {
            document.getElementById('detailPage').style.display = 'none';
            document.getElementById('homeGrid').style.display = 'grid';
            window.scrollTo(0, 0);
        }

        // Initialize page
        renderGrid();
    </script>

</body>
</html>
